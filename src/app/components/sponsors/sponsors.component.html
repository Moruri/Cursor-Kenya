<div class="px-10 md:px-30 lg:px-40 py-16 grid bg-cursor-bg" id="sponsors">
  <h2 class="py-4 text-3xl my-4 md:text-left text-center font-bold text-cursor-text capitalize">Our Community Sponsors</h2>
  <div class="flex flex-col md:flex-row flex-wrap items-center pb-8 space-x-0 md:space-x-8 xl:space-x-16">
    @for (sponsor of sponsors; track sponsor.name) {
      <a [href]="sponsor.url" target="_blank" rel="noopener" class="hover:cursor-pointer hover:opacity-70 transition-opacity duration-300 ease-in-out logo mb-8 md:mb-0">
        <img [class]="sponsor.classes + ' mx-auto'" [src]="sponsor.logo" [alt]="sponsor.name">
      </a>
    }
  </div>
</div>
